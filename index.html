<html>
  <head>
    <title>BlackJack</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>BlackJack</h1>
    
    <div>
      <button id="btn-iniciar">Iniciar partida</button>
      <button id="btn-pedir" style="display:none;">Pedir carta</button>
      <button id="btn-plantarse" style="display:none;">Plantarse</button>
    </div>
    
    <div>
      <h3>Tus cartas:</h3>
      <div id="cartas-jugador"></div>
      <p>Puntuación: <span id="puntuacion-jugador">0</span></p>
    </div>
    
    <div>
      <h3>Cartas del croupier:</h3>
      <div id="cartas-croupier"></div>
      <p>Puntuación: <span id="puntuacion-croupier">0</span></p>
    </div>
    
    <div id="resultado"></div>
    
    <div style="margin-top: 30px;">
      <button id="btn-ejecutar-pruebas">Ejecutar casos de prueba</button>
      <div id="resultados-pruebas"></div>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
