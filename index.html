<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlackJack · 21</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* RESET Y PANTALLA COMPLETA (Sin scroll) */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* Evita cualquier scroll */
      background: #0f0f0f;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* LA MESA DE CASINO (Ocupa todo el espacio lateral posible) */
    .mesa-casino {
      width: 96vw;
      max-width: 1400px; /* Se expande bien a los costados */
      height: 88vh; /* Deja un pequeño margen arriba y abajo */
      background: radial-gradient(circle at center, #1b6b3b 0%, #0a361c 100%);
      border: 16px solid #2e1a0f; /* Borde de madera */
      border-radius: 4rem; /* Bordes bien redondeados simulando la mesa */
      box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 60px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 1rem;
      position: relative;
    }

    /* ZONAS DE JUEGO (Alturas fijas para que NADA se mueva) */
    .zona-jugador, .zona-croupier {
      height: 240px; /* Altura estricta para contener cartas sin empujar la UI */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* TEXTO IMPRESO EN EL PAÑO (Reemplaza al "📌 Tus cartas") */
    .texto-tapete {
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 4px;
      font-size: 0.9rem;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* MARCADORES DE PUNTOS */
    .puntos-badge {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #f9d976;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 1.1rem;
    }

    /* CONTENEDOR INVISIBLE PARA LAS CARTAS (Directo en la mesa) */
    .cartas-container {
      width: 100%;
      height: 150px; /* Altura aproximada de una carta */
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: nowrap; /* Evita que las cartas salten de línea */
    }

    /* ZONA CENTRAL (Botones, Logo y Resultado) */
    .zona-central {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    /* LOGO CENTRAL EN EL PAÑO */
    .logo-mesa {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: rgba(0, 0, 0, 0.2);
      font-weight: 700;
      letter-spacing: 5px;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; /* Para no interferir con clicks */
    }

    /* CONTENEDOR DE BOTONES (Altura fija para no romper diseño al ocultar/mostrar) */
    .controles-container {
      height: 50px;
      display: flex;
      gap: 15px;
      z-index: 2;
    }

    /* BOTONES ESTILO FICHA */
    .btn-casino {
      border-radius: 50px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0.6rem 2rem;
      border: none;
      transition: all 0.1s ease;
      box-shadow: 0 6px 0 rgba(0,0,0,0.5), 0 10px 15px rgba(0,0,0,0.4);
    }
    .btn-casino:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 rgba(0,0,0,0.5), 0 2px 5px rgba(0,0,0,0.4);
    }
    .btn-primary-casino { background: linear-gradient(180deg, #f9d976, #e5b22b); color: #1a1a1a; box-shadow: 0 6px 0 #a67c00; }
    .btn-primary-casino:active { box-shadow: 0 0 0 #a67c00; }
    .btn-danger-casino { background: linear-gradient(180deg, #d32f2f, #9a0007); color: white; box-shadow: 0 6px 0 #600000; }
    .btn-danger-casino:active { box-shadow: 0 0 0 #600000; }

    /* CONTENEDOR DEL RESULTADO (Altura fija) */
    .resultado-container {
      height: 60px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    /* RESULTADO (Sobrescribe las clases de Bootstrap para que no tenga padding brusco) */
    #resultado {
      background: transparent !important;
      border: none !important;
      color: #f9d976 !important;
      font-size: 1.3rem;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(249, 217, 118, 0.4);
      margin: 0 !important;
      padding: 0 !important;
    }

    /* FOOTER AFUERA DE LA MESA */
    .footer-exterior {
      height: 5vh;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.8rem;
      color: #666;
    }
    .footer-exterior a { color: #888; text-decoration: none; transition: 0.3s; }
    .footer-exterior a:hover { color: #d4af37; }
  </style>
</head>
<body>

  <div class="mesa-casino">
    
    <h1 class="logo-mesa">BLACKJACK 21</h1>

    <div class="zona-croupier">
      <div class="texto-tapete">
        Croupier
        <span class="puntos-badge" id="puntuacion-croupier">0</span>
      </div>
      <div id="cartas-croupier" class="cartas-container"></div>
    </div>

    <div class="zona-central">
      
      <div class="controles-container">
        <button id="btn-iniciar" class="btn-casino btn-primary-casino">🃟 Iniciar</button>
        <button id="btn-pedir" class="btn-casino btn-primary-casino" style="display:none;">Pedir Carta</button>
        <button id="btn-plantarse" class="btn-casino btn-danger-casino" style="display:none;">✋ Plantarse</button>
      </div>

      <div class="resultado-container">
        <div id="resultado" role="alert">
          Esperando inicio de partida...
        </div>
      </div>

    </div>

    <div class="zona-jugador">
      <div class="texto-tapete">
        Jugador (Tú)
        <span class="puntos-badge" id="puntuacion-jugador">0</span>
      </div>
      <div id="cartas-jugador" class="cartas-container"></div>
    </div>

  </div>

  <div class="footer-exterior mt-3">
    <span>💡 Ideado por <strong>Leandro Maselli</strong></span>
    <span>✍️ Desarrollado por <strong>DeepSeek</strong></span>
    <span>🖌️ Diseñado por <strong>Gemini</strong></span>
    <span>|</span>
    <a href="https://github.com/leoroan" target="_blank"><i class="fab fa-github"></i> github.com/leoroan</a>
    <span>|</span>
    <span>2026</span>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <script src="script.js"></script>
</body>
</html>
