<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlackJack · 21</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <link rel="stylesheet" href="styles.css">

</head>
<body>

  <div class="mesa-casino">
    
    <h1 class="logo-mesa">BLACKJACK 21</h1>

    <div class="zona-croupier">
      <div class="texto-tapete">
        Croupier
        <span class="puntos-badge" id="puntuacion-croupier">0</span>
      </div>
      <div id="cartas-croupier" class="cartas-container"></div>
    </div>

    <div class="zona-central">
      
      <div class="controles-container">
        <button id="btn-iniciar" class="btn-casino btn-primary-casino">🃟 Iniciar</button>
        <button id="btn-pedir" class="btn-casino btn-primary-casino" style="display:none;">Pedir Carta</button>
        <button id="btn-plantarse" class="btn-casino btn-danger-casino" style="display:none;">✋ Plantarse</button>
      </div>

      <div class="resultado-container">
        <div id="resultado" role="alert">
          Esperando inicio de partida...
        </div>
      </div>

    </div>

    <div class="zona-jugador">
      <div class="texto-tapete">
        Jugador (Tú)
        <span class="puntos-badge" id="puntuacion-jugador">0</span>
      </div>
      <div id="cartas-jugador" class="cartas-container"></div>
    </div>

  </div>

  <div class="footer-exterior mt-3">
    <span>💡 Ideado por <strong>Leandro Maselli</strong></span>
    <span>✍️ Desarrollado por <strong>DeepSeek</strong></span>
    <span>🖌️ Diseñado por <strong>Gemini</strong></span>
    <span>|</span>
    <a href="https://github.com/leoroan" target="_blank"><i class="fab fa-github"></i> github.com/leoroan</a>
    <span>|</span>
    <span>2026</span>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <script src="script.js"></script>
</body>
</html>
